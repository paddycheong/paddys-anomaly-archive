name: Weekly Automated Curation Drop

on:
  schedule:
    # Runs every Sunday at 04:00 UTC (12:00 PM Beijing Time / UTC+8)
    - cron: '0 4 * * 0'
  # Allows manual 1-click trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  curate-and-propose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Curation Engine
        run: node scripts/curate-weekly.mjs

      - name: Verify Build
        run: npm run build

      - name: Read Drop Summary
        id: read_summary
        run: |
          SUMMARY=$(cat scripts/latest-drop-summary.md)
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Pull Request for User Review
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(curation): weekly automated drop ${{ steps.read_summary.outputs.date }} (15 items >$100, 40% TikTok Shop)"
          title: "📦 [Weekly Drop] Curated Batch: ${{ steps.read_summary.outputs.date }} (15 New Artifacts)"
          body: ${{ steps.read_summary.outputs.summary }}
          branch: "curation/drop-${{ steps.read_summary.outputs.date }}"
          delete-branch: true
          labels: |
            weekly-drop
            ready-for-review
            automated-curation
