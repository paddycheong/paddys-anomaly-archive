name: Weekly Automated Curation Drop

on:
  schedule:
    # Runs every Monday at 03:00 UTC (12:00 PM Tokyo Time JST / UTC+9)
    # Curates Global Top 15 items by velocity over the previous week (Monday to Sunday)
    - cron: '0 3 * * 1'
  # Allows manual 1-click trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Curation Engine
        run: node scripts/curate-weekly.mjs

      - name: Verify Build
        run: npm run build

      - name: Read Drop Summary
        id: read_summary
        run: |
          SUMMARY=$(cat scripts/latest-drop-summary.md)
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Commit and Push Directly to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/items.ts scripts/latest-drop-summary.md
          if git diff --staged --quiet; then
            echo "No catalog changes detected. Catalog is already up to date."
          else
            git commit -m "feat(curation): weekly automated drop ${{ steps.read_summary.outputs.date }} (Top 15 Velocity >$100, 40% TikTok Shop)"
            git push origin main
            echo "Successfully pushed update to main branch. Cloudflare Workers will trigger automatic production build."
          fi
